name: Build Android APK

on:
  push:
    branches: [ main, master, Fixed-, Fixed ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP if exists
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" -type f | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "Found ZIP: $ZIP"
            unzip -q "$ZIP"
            GRADLE=$(find . -maxdepth 3 -name "build.gradle" -type f | head -n 1)
            if [ -n "$GRADLE" ]; then
              PROJ_DIR=$(dirname "$GRADLE")
              if [ "$PROJ_DIR" != "." ]; then
                cp -rf "$PROJ_DIR"/* .
                cp -rf "$PROJ_DIR"/.* . 2>/dev/null || true
              fi
            fi
          fi

      - name: Fix Dependencies
        run: |
          if [ -f "app/build.gradle" ]; then
            # أضف activity-ktx إذا ما كانت موجودة
            if ! grep -q "activity-ktx" app/build.gradle; then
              sed -i "/androidx.core:core-ktx/a\    implementation 'androidx.activity:activity-ktx:1.8.2'" app/build.gradle
            fi
            # استبدل الـ Xray dependency الخاطئة
            sed -i "s|com\.github\.2dust:AndroidLibXrayLite[^']*|files('libs/libv2ray.aar')|g" app/build.gradle
          fi

      - name: Setup Properties
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download Xray Core
        run: |
          mkdir -p app/libs
          curl -fL "https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar" -o app/libs/libv2ray.aar

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
